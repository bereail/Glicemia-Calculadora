<section class="panel panel-result resultado-screen resultado-screen--rango">
  <div class="result-top">
    <span class="result-chip">Resultados</span>
  </div>

  <h2 class="result-title">Evaluación</h2>

  <div class="estado-box estado-box--rango">
    <p class="estado-label">Estado</p>
    <p class="estado-value">{{ resultado.estado }}</p>
  </div>

  {% if resultado.conducta %}
    <div class="result-card result-card--rango">
      <h3>Conducta sugerida</h3>
      <p>{{ resultado.conducta|safe }}</p>
    </div>
  {% endif %}

  {% if resultado.proximo_control %}
    <div class="resultado-prioridad resultado-prioridad--rango">
      <strong>Próximo control:</strong> {{ resultado.proximo_control }}
    </div>
  {% endif %}
</section>
