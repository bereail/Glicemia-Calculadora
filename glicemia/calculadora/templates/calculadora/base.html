{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}Control Glicemia{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'calculadora/css/base.css' %}?v=20260420-1">
  <link rel="stylesheet" href="{% static 'calculadora/css/control_glicemia.css' %}?v=20260420-1">
  <link rel="stylesheet" href="{% static 'calculadora/css/resultado_base.css' %}?v=20260420-1">
  <link rel="stylesheet" href="{% static 'calculadora/css/tabla_algoritmo.css' %}?v=20260420-1">

  {% block extra_css %}{% endblock %}
</head>

<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <h1 class="logo">Glicemia</h1>

      <nav>
        <a href="{% url 'control_glicemia' %}" class="btn">Inicio</a>
        <a href="{% url 'historial' %}" class="btn">Historial</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}
  <script src="{% static 'calculadora/js/hipoglice.js' %}?v=20260420-1"></script>
  <script src="{% static 'calculadora/js/hiperglicemia.js' %}?v=20260420-1"></script>
  <script src="{% static 'calculadora/js/control_glicemia.js' %}?v=20260420-1"></script>
  {% endblock %}
</body>
</html>
