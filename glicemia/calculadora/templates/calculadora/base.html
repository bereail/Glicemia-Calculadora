{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}Control Glicemia{% endblock %}</title>

  <!-- =========================
       CSS GLOBAL (BASE)
  ========================== -->
  <link rel="stylesheet" href="{% static 'calculadora/css/base.css' %}?v=1">
  <link rel="stylesheet" href="{% static 'calculadora/css/styles.css' %}?v=1">

  <!-- =========================
       CSS DE PANTALLA
  ========================== -->
  <link rel="stylesheet" href="{% static 'calculadora/css/control_glicemia.css' %}?v=1">

  <!-- =========================
       CSS DE RESULTADOS (ORDEN IMPORTA)
       Más específico abajo
  ========================== -->
  <link rel="stylesheet" href="{% static 'calculadora/css/resultado_rango.css' %}?v=1">
  <link rel="stylesheet" href="{% static 'calculadora/css/resultado_hiper.css' %}?v=3">
  <link rel="stylesheet" href="{% static 'calculadora/css/resultado_hipo.css' %}?v=1">

  {% block extra_css %}{% endblock %}
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <header class="topbar">
    <div class="container topbar__inner">
      <h1 class="logo">Glicemia</h1>

      <nav>
        <a href="{% url 'control_glicemia' %}" class="btn">Inicio</a>
        <a href="{% url 'historial' %}" class="btn">Historial</a>
      </nav>
    </div>
  </header>

  <!-- =========================
       CONTENIDO
  ========================== -->
  <main>
    {% block content %}
    {% endblock %}
  </main>

  <!-- =========================
       FOOTER
  ========================== -->
  <footer class="footer">
    <div class="container">
      <p>© {% now "Y" %} - Calculadora de Glicemia</p>
    </div>
  </footer>

  <!-- =========================
       JS
  ========================== -->
  {% block extra_js %}
    <script src="{% static 'calculadora/js/control_glicemia.js' %}?v=3"></script>
  {% endblock %}

</body>
</html>
