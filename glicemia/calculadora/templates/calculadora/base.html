{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}Control Glicemia{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'calculadora/css/base.css' %}?v=20">
  <link rel="stylesheet" href="{% static 'calculadora/css/styles.css' %}?v=20">

  {% block extra_css %}{% endblock %}
</head>

<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <h1 class="logo">Glicemia</h1>

      <nav>
        <a href="{% url 'control_glicemia' %}" class="btn">Inicio</a>
        <a href="{% url 'historial' %}" class="btn">Historial</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p>© {% now "Y" %} · Calculadora de Glicemia · Uso clínico interno</p>
    </div>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
