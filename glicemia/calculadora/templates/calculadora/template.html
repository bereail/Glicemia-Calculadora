<form method="post" id="glucemia-form" novalidate>
    {% csrf_token %}

    <div class="field">
        <label for="{{ form.glicemia_actual.id_for_label }}">Glicemia actual</label>
        {{ form.glicemia_actual }}
        {{ form.glicemia_actual.errors }}
    </div>

    <div class="field">
        <label>Insulinización activa</label>
        <div class="radio-group">
            {{ form.insulinizacion_activa }}
        </div>
        {{ form.insulinizacion_activa.errors }}
    </div>

    <div id="preiva-opcional-box" class="field hidden">
        <label class="check-inline">
            {{ form.usar_previa_opcional }}
            Agregar glicemia previa
        </label>
    </div>

    <div id="previa-box" class="field hidden">
        <label for="{{ form.glicemia_previa.id_for_label }}">Glicemia previa</label>
        {{ form.glicemia_previa }}
        {{ form.glicemia_previa.errors }}
    </div>

    <button type="submit" class="btn-main">Evaluar</button>
</form>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const radios = document.querySelectorAll('input[name="insulinizacion_activa"]');
    const previaBox = document.getElementById("previa-box");
    const previaOpcionalBox = document.getElementById("preiva-opcional-box");
    const usarPrevia = document.getElementById("id_usar_previa_opcional");
    const previaInput = document.getElementById("id_glicemia_previa");

    function actualizarVista() {
        const seleccionado = document.querySelector('input[name="insulinizacion_activa"]:checked');

        previaBox.classList.add("hidden");
        previaOpcionalBox.classList.add("hidden");
        previaInput.required = false;

        if (!seleccionado) return;

        if (seleccionado.value === "si") {
            previaBox.classList.remove("hidden");
            previaInput.required = true;
        } else if (seleccionado.value === "no") {
            previaOpcionalBox.classList.remove("hidden");

            if (usarPrevia && usarPrevia.checked) {
                previaBox.classList.remove("hidden");
            }
        }
    }

    radios.forEach(radio => {
        radio.addEventListener("change", actualizarVista);
    });

    if (usarPrevia) {
        usarPrevia.addEventListener("change", actualizarVista);
    }

    actualizarVista();
});
</script>
